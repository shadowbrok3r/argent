# Writes RingDesigner designs as the FINISHED ring at nominal size (what the
# showcase examples save as finished-metal.stl) plus every stone as its own
# closed solid. The stock `ringdesign export` CLI writes the casting pattern
# for STL (sand designs lose their made settings) and never writes stones.
#
# Build (from this directory):
#   CARGO_TARGET_DIR=$HOME/argent/target-ringdesigner cargo build --release
[package]
name = "rd-finished-export"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
# The RingDesigner clone this was built against (github shadowbrok3r/RingDesigner @ 006e043).
# Pinned to the RingDesigner commit the assets were exported from.
ringdesign-core = { git = "https://github.com/shadowbrok3r/RingDesigner", rev = "006e043842b8c6c3a3d774fa8810baf6d6dc9de3" }
anyhow = "1"
serde_json = "1"

# Its own workspace root, so it never joins argent's workspace.
[workspace]

[package]
name = "argent-post"
description = "Film development for argent: denoising (OIDN or built-in), AgX tone mapping, image and video output, contact sheets, Forge reel QC."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
# OIDN is dlopen'ed at runtime, so the crate builds (and falls back) anywhere.
libloading = "0.9.0"
exr = "1.74.2"
# Rasterisation (ab_glyph) + OpenType shaping for GPOS kerning (rustybuzz).
ab_glyph = "0.2.32"
rustybuzz = "0.20.1"

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="argent">
<title>argent studio</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/studio.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand" aria-label="argent">
      <svg class="sigil" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11.5"/><path d="M16 4.5c-5.5 3.2-5.5 19.8 0 23"/><circle cx="16" cy="16" r="2.2" class="pip"/></svg>
      <span class="word">argent</span>
    </div>
    <button id="pieceBtn" class="piece-btn" type="button" aria-label="Open the library">
      <span id="pieceName">Choose a piece</span>
      <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5"/></svg>
    </button>
    <span id="conn" class="conn" title="connecting"></span>
  </header>

  <main id="stage">
    <div id="viewport">
      <canvas id="frame" aria-label="Live render: drag to orbit, pinch or scroll to zoom, double-tap to reset"></canvas>
      <div id="empty" class="overlay center" hidden>
        <p class="eyebrow">Live studio</p>
        <h1>Choose a piece to light</h1>
        <button class="btn primary" type="button" data-open-library>Open the library</button>
      </div>
      <div id="preparing" class="overlay center glass" hidden>
        <p class="eyebrow">Preparing</p>
        <h2 id="prepName"></h2>
        <div class="bar"><i id="prepBar"></i></div>
        <p id="prepNote" class="muted small"></p>
      </div>
      <div id="paused" class="banner" hidden></div>
      <div id="hud" class="hud" aria-live="off"></div>
      <div id="gesture" class="gesture" hidden></div>
      <div id="spp"><i></i></div>
      <button id="shutter" class="shutter" type="button" title="Render a still of this frame" aria-label="Render a still">
        <svg viewBox="0 0 64 64" aria-hidden="true"><circle class="ring" cx="32" cy="32" r="29"/><circle class="prog" cx="32" cy="32" r="29"/><circle class="core" cx="32" cy="32" r="22"/></svg>
      </button>
    </div>
  </main>

  <section id="panel" aria-label="Controls">
    <nav id="tabs" role="tablist">
      <button role="tab" data-tab="piece">Piece</button>
      <button role="tab" data-tab="metal">Metal</button>
      <button role="tab" data-tab="light">Light</button>
      <button role="tab" data-tab="camera">Camera</button>
      <button role="tab" data-tab="render">Render<b id="jobBadge" hidden></b></button>
      <button role="tab" data-tab="gallery">Gallery</button>
    </nav>
    <div id="panes">
      <div class="pane" data-pane="piece"></div>
      <div class="pane" data-pane="metal"></div>
      <div class="pane" data-pane="light"></div>
      <div class="pane" data-pane="camera"></div>
      <div class="pane" data-pane="render"></div>
      <div class="pane" data-pane="gallery"></div>
    </div>
  </section>
</div>

<div id="library" class="sheet" hidden role="dialog" aria-modal="true" aria-label="Library">
  <div class="sheet-head">
    <h2>Library</h2>
    <input id="libSearch" type="search" placeholder="Search pieces" autocomplete="off" spellcheck="false">
    <button class="icon-btn" type="button" data-close aria-label="Close"><svg viewBox="0 0 16 16"><path d="M3 3l10 10M13 3 3 13"/></svg></button>
  </div>
  <div id="libList" class="sheet-body"></div>
</div>

<div id="lightbox" class="sheet lightbox" hidden role="dialog" aria-modal="true" aria-label="Render">
  <div class="sheet-head">
    <h2 id="lbTitle"></h2>
    <button class="icon-btn" type="button" data-close aria-label="Close"><svg viewBox="0 0 16 16"><path d="M3 3l10 10M13 3 3 13"/></svg></button>
  </div>
  <div id="lbBody" class="sheet-body"></div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<script src="/studio.js"></script>
</body>
</html>

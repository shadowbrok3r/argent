[package]
name = "argent"
description = "Photoreal jewelry renders from STL: stills, turntable reels, listing sheets, a live studio."
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "argent"
path = "src/main.rs"

[dependencies]
argent-core.workspace = true
argent-mesh.workspace = true
argent-spectra.workspace = true
argent-post.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
glam.workspace = true
parking_lot.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2"
# Live studio (`argent serve`): HTTP + WebSocket server and fast preview JPEGs.
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal"] }
jpeg-encoder = { version = "0.7.1", features = ["simd"] }

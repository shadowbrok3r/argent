[workspace]
resolver = "3"
members = [
    "crates/argent-mesh",
    "crates/argent-spectra",
    "crates/argent-post",
    "crates/argent-core",
    "crates/argent",
    "crates/argent-export",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
authors = ["Logan <logan@kingsofalchemy.com>"]

[workspace.dependencies]
argent-mesh = { path = "crates/argent-mesh" }
argent-spectra = { path = "crates/argent-spectra" }
argent-post = { path = "crates/argent-post" }
argent-core = { path = "crates/argent-core" }
argent-export = { path = "crates/argent-export" }
anyhow = "1.0.104"
glam = "0.34.1"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sobol_burley = "0.5.0"
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
panic = "unwind"

# Fast enough to test path tracing without --release.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
